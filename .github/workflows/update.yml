name: update

on:
  schedule:
    # Every 30 min, 6:00am–11:30pm US Eastern (EDT = UTC-4; an hour earlier in winter).
    - cron: "*/30 10-23 * * *"
    - cron: "*/30 0-3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/index.html", "build.py", "blackbaud.enc", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build encrypted data
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python build.py

      - name: Save history
        run: |
          git config user.name "homework-hq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.enc
          git diff --cached --quiet || { git commit -q -m "history: $(date -u +%F)"; git push -q; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
