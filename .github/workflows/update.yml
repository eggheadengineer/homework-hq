name: update

on:
  schedule:
    # Backup only: GitHub drops many scheduled runs. The Mac fetcher dispatches this every 30 min.
    # Every 30 min, 6:00am–11:30pm US Eastern (EDT = UTC-4; an hour earlier in winter).
    - cron: "*/30 10-23 * * *"
    - cron: "*/30 0-3 * * *"
  workflow_dispatch:
    inputs:
      bb_checked:
        description: "When the Mac last checked Blackbaud (ISO time)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", "build.py", "blackbaud.enc", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # dispatched runs otherwise check out the commit from dispatch time

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build encrypted data
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BB_CHECKED: ${{ inputs.bb_checked }}
          STUDY_CAL_ID: ${{ secrets.STUDY_CAL_ID }}
          STUDY_CAL_NAME: ${{ secrets.STUDY_CAL_NAME }}
          STUDY_CAL_ICS: ${{ secrets.STUDY_CAL_ICS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python build.py

      - name: Save history
        continue-on-error: true  # never block the deploy over the trend file
        run: |
          git config user.name "homework-hq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.enc
          git diff --cached --quiet && exit 0
          git commit -q -m "history: $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
